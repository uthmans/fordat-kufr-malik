publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.11.0
  flutter_secure_storage: 11.2.0
  geolocator: 14.1.2
  local_auth: 3.0.2
